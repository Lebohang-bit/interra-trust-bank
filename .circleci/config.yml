version: 2.1

jobs:
  scan:
    docker:
      - image: cimg/node:18.18.0
    steps:
      - checkout
      - run: npm install
      - run: CI=true npm test -- --coverage --watchAll=false --passWithNoTests
      - run:
          name: Install SonarScanner
          command: npm install -g sonarqube-scanner
      - run:
          name: Run SonarCloud Scan
          command: |
            sonar-scanner \
              -Dsonar.projectKey=lebohang-bit_interra-trust-bank \
              -Dsonar.organization=lebohang-bit \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN

workflows:
  version: 2
  ci:
    jobs:
      - scan
